<!-- cart.component.html -->

<div class="cart-wrapper">

  <h2>
    Your Shopping Cart
  </h2>



  <div class="cart-container">

    <div
      class="cart-item"
      *ngFor="let item of cartItems"
    >

      <img [src]="item.image">



      <div class="cart-details">

        <h3>
          {{item.name}}
        </h3>

        <p class="price">
          Ksh {{item.Price}}
        </p>

      </div>



      <div class="cart-qty">

        <button
          (click)="decreaseQty(item)"
        >
          -
        </button>

        <span>
          {{item.Quantity}}
        </span>

        <button
          (click)="increaseQty(item)"
        >
          +
        </button>

      </div>



      <div
        class="cart-remove"
        (click)="removeItem(item)"
      >
        ✖ REMOVE
      </div>

    </div>

  </div>



  <div class="cart-summary">

    <div class="summary-row">

      <span>
        Subtotal
      </span>

      <span>
        Ksh {{total}}
      </span>

    </div>



    <div class="summary-row">

      <span>
        Shipping
      </span>

      <span>
        Free
      </span>

    </div>



    <div class="summary-row total">

      <span>
        Total
      </span>

      <span>
        Ksh {{total}}
      </span>

    </div>



    <div class="checkout-buttons">

      <button
        (click)="checkout('MPESA')"
      >
        Pay With M-Pesa
      </button>



      <button
        (click)="checkout('PAY_ON_DELIVERY')"
      >
        Pay On Delivery
      </button>

    </div>

  </div>

</div>



<!-- ================= MPESA POPUP ================= -->

<div
  class="mpesa-popup"
  *ngIf="showMpesaPopup"
>

  <div class="popup-content">

    <h3>
      Enter M-Pesa Number
    </h3>



    <input

      type="text"

      placeholder="2547XXXXXXXX"

      [(ngModel)]="mpesaPhone"
    >



    <div class="popup-buttons">

      <button
        (click)="confirmMpesaPayment()"
      >
        Pay
      </button>



      <button
        (click)="showMpesaPopup = false"
      >
        Cancel
      </button>

    </div>

  </div>

</div>
