<div class="body">

<div class="auth-wrapper" [ngClass]="{ toggled: isRegisterMode }">

    <div class="background-shape"></div>
    <div class="secondary-shape"></div>

    <!-- LOGIN PANEL -->
    <div class="credentials-panel signin">

        <h2 class="slide-element">Login</h2>

        <form (ngSubmit)="login()">

            <div class="field-wrapper slide-element">
                <input
                    type="email"
                    required
                    name="email"
                    [(ngModel)]="loginData.email"
                >
                <label>Email</label>
                <i class="fa-solid fa-user"></i>
            </div>

            <div class="field-wrapper slide-element">
                <input
                    type="password"
                    required
                    name="password"
                    [(ngModel)]="loginData.password"
                >
                <label>Password</label>
                <i class="fa-solid fa-lock"></i>
            </div>

            <div class="field-wrapper slide-element">
                <button class="submit-button" type="submit">
                    Login
                </button>
            </div>

            <div class="switch-link slide-element">
                <p>
                    Don't have an account?<br>
                    <a href="#" (click)="switchToRegister($event)">
                        Sign Up
                    </a>
                </p>
            </div>

        </form>

    </div>


    <!-- LOGIN WELCOME -->
    <div class="welcome-section signin">
        <h2 class="slide-element">WELCOME BACK!</h2>
    </div>


    <!-- REGISTER PANEL -->
    <div class="credentials-panel signup">

        <h2 class="slide-element">Register</h2>

        <form (ngSubmit)="register()">

            <div class="field-wrapper slide-element">
                <input
                    type="text"
                    required
                    name="username"
                    [(ngModel)]="registerData.username"
                >
                <label>Username</label>
                <i class="fa-solid fa-user"></i>
            </div>

            <div class="field-wrapper slide-element">
                <input
                    type="email"
                    required
                    name="email"
                    [(ngModel)]="registerData.email"
                >
                <label>Email</label>
                <i class="fa-solid fa-envelope"></i>
            </div>

            <div class="field-wrapper slide-element">
                <input
                    type="password"
                    required
                    name="password"
                    [(ngModel)]="registerData.password"
                >
                <label>Password</label>
                <i class="fa-solid fa-lock"></i>
            </div>

            <div class="field-wrapper slide-element">
                <input
                    type="text"
                    required
                    name="phonenumber"
                    [(ngModel)]="registerData.phonenumber"
                >
                <label>Phone Number</label>
                <i class="fa-solid fa-phone"></i>
            </div>

            <div class="field-wrapper slide-element">
                <button class="submit-button" type="submit">
                    Register
                </button>
            </div>

            <div class="switch-link slide-element">
                <p>
                    Already have an account?<br>
                    <a href="#" (click)="switchToLogin($event)">
                        Sign In
                    </a>
                </p>
            </div>

        </form>

    </div>


    <!-- REGISTER WELCOME -->
    <div class="welcome-section signup">
        <h2 class="slide-element">WELCOME!</h2>
    </div>

</div>

</div>
